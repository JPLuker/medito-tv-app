name: Flutter Web Build

on:
  push:
    branches:
      - feature/pwa-tv-foundation
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Flutter version
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build web
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          flutter build web --release --dart-define-from-file=.mock.json 2>&1 | tee /tmp/web-build.log
          build_exit=${PIPESTATUS[0]}
          set -e

          if [ "$build_exit" -ne 0 ]; then
            first_error="$(grep -m1 -E '(^|[[:space:]])(Error:|error:)' /tmp/web-build.log || true)"
            if [ -z "$first_error" ]; then
              first_error="Flutter web build failed; inspect workflow logs"
            fi
            first_error="${first_error:0:130}"
            payload="$(jq -n --arg state failure --arg context 'web-build/error' --arg description "$first_error" '{state:$state,context:$context,description:$description}')"
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
            exit "$build_exit"
          fi
