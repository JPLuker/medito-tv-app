name: Android TV Build

on:
  push:
    branches:
      - feature/android-tv-support
  workflow_dispatch:

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-build:
    name: Android TV AAB + Google TV Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Run pigeon
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Create compile-only Android config
        run: |
          cat > android/keystore.properties <<'EOF'
          appId=meditofoundation.medito
          storeFile=tv-ci.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          keytool -genkeypair \
            -keystore android/tv-ci.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android TV CI,OU=CI,O=Medito,L=Test,ST=Test,C=US"

          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "medito-tv-ci",
              "storage_bucket": "medito-tv-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "meditofoundation.medito"
                  }
                },
                "api_key": [
                  { "current_key": "mock-api-key" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Android TV App Bundle
        run: |
          flutter build appbundle --flavor prod --release \
            --dart-define-from-file=.mock.json \
            --dart-define=MOCK_MODE=true \
            --obfuscate --split-debug-info=./symbols

          AAB=$(find build/app/outputs/bundle -type f -name '*.aab' | head -n 1)
          test -n "$AAB"
          echo "Built: $AAB"
          ls -lh "$AAB"

      - name: Verify merged TV manifest
        run: |
          MANIFEST=$(grep -rl 'android.intent.category.LEANBACK_LAUNCHER' \
            build/app/intermediates --include=AndroidManifest.xml \
            | grep -E 'prodRelease|prod_release|release' \
            | head -n 1 || true)

          test -n "$MANIFEST"
          echo "Checking merged manifest: $MANIFEST"
          grep -q 'android.software.leanback' "$MANIFEST"
          grep -q 'android.hardware.touchscreen' "$MANIFEST"
          grep -q 'android.hardware.faketouch' "$MANIFEST"
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$MANIFEST"
          grep -q 'tv_banner' "$MANIFEST"

          # The combined phone/TV bundle must not declare touch or Leanback as required.
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          root = ET.parse(manifest_path).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          features = {
              node.get(android + 'name'): node.get(android + 'required')
              for node in root.findall('uses-feature')
          }

          expected_optional = [
              'android.software.leanback',
              'android.hardware.touchscreen',
              'android.hardware.faketouch',
          ]
          for feature in expected_optional:
              if features.get(feature) != 'false':
                  raise SystemExit(f'{feature} must be android:required="false"; got {features.get(feature)!r}')
          PY

      - name: Build installable TV smoke-test APK
        run: |
          flutter build apk --flavor prod --debug \
            --dart-define-from-file=.mock.json \
            --dart-define=MOCK_MODE=true

          test -f build/app/outputs/flutter-apk/app-prod-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-prod-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Google TV emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: true
          script: |
            set -euo pipefail
            APK=build/app/outputs/flutter-apk/app-prod-debug.apk
            PACKAGE=meditofoundation.medito

            adb install -r "$APK"

            echo "Google TV system features:"
            adb shell pm list features | grep -E 'leanback|television|touchscreen|faketouch' || true
            adb shell pm list features | grep -q 'feature:android.software.leanback'

            echo "Resolving Leanback launcher activity:"
            RESOLVED=$(adb shell cmd package resolve-activity --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LEANBACK_LAUNCHER \
              "$PACKAGE" | tr -d '\r')
            echo "$RESOLVED"
            echo "$RESOLVED" | grep -q 'meditofoundation.medito/.MainActivity'

            adb logcat -c
            adb shell am start -W \
              -a android.intent.action.MAIN \
              -c android.intent.category.LEANBACK_LAUNCHER \
              -n "$PACKAGE/.MainActivity"
            sleep 10

            # Exercise the same key events delivered by a basic TV remote.
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_LEFT
            adb shell input keyevent KEYCODE_DPAD_UP
            sleep 2

            # The app must still be alive after startup and D-pad navigation.
            adb shell pidof "$PACKAGE"

            mkdir -p /tmp/android-tv-smoke
            adb exec-out screencap -p > /tmp/android-tv-smoke/screenshot.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/android-tv-smoke/window.xml || true
            adb logcat -d > /tmp/android-tv-smoke/logcat.txt

            if grep -E 'FATAL EXCEPTION|Process: meditofoundation.medito.*has died' \
              /tmp/android-tv-smoke/logcat.txt; then
              echo "Medito crashed during Google TV smoke test"
              exit 1
            fi

      - name: Upload Google TV smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medito-google-tv-smoke
          path: /tmp/android-tv-smoke/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload TV AAB
        uses: actions/upload-artifact@v4
        with:
          name: medito-android-tv-aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 14
